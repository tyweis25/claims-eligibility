apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-eligibility
  labels:
    app: claims-eligibility
spec:
  replicas: {{.Values.replicas}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: claims-eligibility
  template:
    metadata:
      labels:
        app: claims-eligibility
    spec:
      containers:
        - name: claims-eligibility
          image: {{.Values.image}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FEATURE_X
              value: "{{.Values.featureX}}"
            - name: FEATURE_Y
              value: "{{.Values.featureY}}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
